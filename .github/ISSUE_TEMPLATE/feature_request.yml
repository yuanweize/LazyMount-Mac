name: Feature Request
description: Suggest an improvement or additional storage backend for LazyMount-Mac.
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: What capability would you like to see added?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: Explain how this helps macOS NAS or cloud storage users.
