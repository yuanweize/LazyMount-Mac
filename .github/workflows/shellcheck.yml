name: Shell Check & CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          ignore_paths: '.venv'
          severity: error

      - name: Shell syntax
        run: bash -n mount_manager.sh install.sh mount_manager.example.local.sh
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
